<button (click)="openModal()" class="w-full text-left">
  <ng-content></ng-content>
</button>

@if (isModalOpen) {
<div class="modal modal-open">
  <div class="modal-box">
    <h3 class="text-lg font-bold mb-4">
      <span class="icon-[heroicons--exclamation-triangle] text-warning mr-2"></span>
      {{ 'configuration.delete.title' | transloco }}
    </h3>

    <p class="mb-6">{{ 'configuration.delete.confirmation' | transloco }}</p>

    <div class="bg-base-200 p-4 rounded-lg mb-6">
      <div class="space-y-2">
        <div class="flex justify-between">
          <span class="font-medium">{{ 'configuration.currency' | transloco }}:</span>
          <span>{{ configuration().currency }}</span>
        </div>
        <div class="flex justify-between">
          <span class="font-medium">{{ 'configuration.phonePrefix' | transloco }}:</span>
          <span>{{ configuration().phonePrefix }}</span>
        </div>
      </div>
    </div>

    <div class="modal-action">
      <button (click)="closeModal()" class="btn">
        {{ 'actions.cancel' | transloco }}
      </button>
      <button (click)="onConfirm()" class="btn btn-error">
        <span class="icon-[heroicons--trash]"></span>
        {{ 'actions.delete' | transloco }}
      </button>
    </div>
  </div>
</div>
}
