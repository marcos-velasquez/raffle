<ul class="w-full grid md:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 justify-items-center gap-y-12 gap-x-4">
  @for (configuration of configurationStore.configurations(); track configuration.getId()) {
  <li class="md:w-full relative animate-fade-in">
    <app-configuration-card [configuration]="configuration" />
    <app-configuration-toolbar [configuration]="configuration" />
  </li>
  }
  <app-configuration-creator class="animate-fade-in" />
</ul>
