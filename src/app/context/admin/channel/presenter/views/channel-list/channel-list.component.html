<ul class="w-full grid md:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 justify-items-center gap-y-12 gap-x-4">
  @for (channel of configurationStore.configurations(); track channel.getId()) {
  <li class="md:w-full relative animate-fade-in">
    <app-channel-card [channel]="channel" />
    <app-channel-toolbar [channel]="channel" />
  </li>
  }
  <app-channel-creator class="animate-fade-in" />
</ul>
